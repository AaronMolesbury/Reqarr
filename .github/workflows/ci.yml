name: Validate and publish

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum
            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      printf '%s\n' "$unformatted"
                      exit 1
                  fi
            - run: go test ./...
            - run: go vet ./...
            - name: Check known Go vulnerabilities
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    client:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm test
            - run: npm run build
            - run: npm audit --audit-level=high

    image:
        needs: [api, client]
        runs-on: ubuntu-latest
        env:
            PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Check publishing settings
              if: env.PUBLISH_IMAGE == 'true'
              env:
                  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
                  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: |
                  if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_IMAGE" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
                      echo 'Set DOCKERHUB_USERNAME and DOCKERHUB_IMAGE repository variables, and the DOCKERHUB_TOKEN repository secret.'
                      exit 1
                  fi
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
            - name: Sign in to Docker Hub
              if: env.PUBLISH_IMAGE == 'true'
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  platforms: linux/amd64
                  push: ${{ env.PUBLISH_IMAGE == 'true' }}
                  tags: |
                      ${{ vars.DOCKERHUB_IMAGE || 'reqarr' }}:latest
                      ${{ vars.DOCKERHUB_IMAGE || 'reqarr' }}:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  provenance: mode=max
                  sbom: true
